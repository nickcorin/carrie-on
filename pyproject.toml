[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "carrie-on"
description = "A local queue for resuming Codex work after usage resets"
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]

[project.scripts]
carrie-on = "carrie_on.cli:main"
carrie-on-server = "carrie_on.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
dependencies = {file = "requirements.txt"}

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".build-venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = [
    "src/carrie_on/queue.py", "src/carrie_on/storage.py", "src/carrie_on/legacy.py",
    "src/carrie_on/codex/models.py", "src/carrie_on/codex/client.py",
    "src/carrie_on/application.py", "src/carrie_on/dispatch.py",
    "src/carrie_on/api.py", "src/carrie_on/server.py",
    "src/carrie_on/cli.py", "src/carrie_on/macos/runtime.py",
    "src/carrie_on/macos/installation.py", "src/carrie_on/macos/lifecycle.py",
    "src/carrie_on/macos/updates.py", "src/carrie_on/macos/legacy_migration.py",
]
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true
