name: Set up the bundle toolchain
description: Install the pinned uv-managed Python and build dependencies.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: '0.12.5'
        enable-cache: false
    - shell: bash
      run: |
        uv python install
        uv venv --python "$(cat .python-version)" .venv
        uv pip install --python .venv/bin/python -r requirements-build.txt
