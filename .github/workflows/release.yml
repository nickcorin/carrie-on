name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build.yml
  draft:
    name: Prepare draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: carrie-on-macos-arm64
          path: dist
      - name: Prepare release notes
        run: python3 release.py --tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Verify transferred checksums
        working-directory: dist
        run: sha256sum --check *.zip.sha256
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/is-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/is-draft")" != true ]]; then
              echo 'A published release already exists. Bump VERSION; published assets are never replaced.' >&2
              exit 1
            fi
            gh release edit "$tag" --title "Carrie On $tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" --verify-tag --draft --title "Carrie On $tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$tag" dist/*.zip dist/*.zip.sha256 dist/*.json --clobber
