name: Build and verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  bundle:
    name: Verified Apple Silicon bundle
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Validate release metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            .venv/bin/python release.py --tag "$GITHUB_REF_NAME"
          else
            .venv/bin/python release.py
          fi
      - name: Check dashboard JavaScript
        run: node --check web/app.js
      - name: Build, sign, and verify archive
        run: .venv/bin/python build_bundle.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carrie-on-macos-arm64
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.json
          if-no-files-found: error
          retention-days: 14
